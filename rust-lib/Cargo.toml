[package]
edition = "2024"
name = "rust-lib"
version = "2.21.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.15.0", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3.5.5"
keyring = { version = "3.6.3", features = ["windows-native", "sync-secret-service"] }
markdown-it = "0.6.1"
glob-match = "0.2.1"
env_logger = "0.11.11"
log = "0.4.34"
colored = "3.1.1"
markdown-it-footnote = "0.2.0"
markdown-it-lazyload = "1.0.0"
markdown-it-image-figure = "0.1.0"
exif = { package = "kamadak-exif", version = "0.6.1" }
regex = "1.13.1"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
syntect = { version = "5.3.0", default-features = true }


[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
strip = "symbols"
